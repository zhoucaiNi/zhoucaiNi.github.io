<svg width="340" height="256" viewBox="0 0 340 256" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- same rounded-tip pine as background.svg, tip at the origin, 120 tall -->
<path id="pine" d="M-1.97 1.5C-1.58 -0.7 1.59 -0.7 1.97 1.5L22.2 117.7C22.4 118.9 21.47 120 20.2 120H-20.2C-21.47 120 -22.4 118.9 -22.2 117.7L-1.97 1.5Z"/>
</defs>
<!-- far pines, tucked behind the house like the tree clusters on the hills -->
<use href="#pine" fill="#53660D" transform="translate(38 122) scale(0.95)"/>
<use href="#pine" fill="#53660D" transform="translate(106 134) scale(0.85)"/>
<use href="#pine" fill="#343C00" transform="translate(72 108) scale(1.05)"/>
<use href="#pine" fill="#53660D" transform="translate(268 126) scale(0.9)"/>
<use href="#pine" fill="#53660D" transform="translate(330 124) scale(0.92)"/>
<use href="#pine" fill="#343C00" transform="translate(299 110) scale(1.04)"/>
<!-- path running down toward the lake -->
<path d="M156 232C155 240 152 246 146 252H194C188 246 186 240 186 232H156Z" fill="#BAD578"/>
<!-- chimney -->
<rect x="196" y="98" width="14" height="40" fill="#C98E6B"/>
<rect x="193" y="94" width="20" height="7" rx="2" fill="#A87257"/>
<!-- walls, gable included, in the sky's peach -->
<path d="M115 232V158L170 104L225 158V232H115Z" fill="#F3C9A6"/>
<path d="M115 158L170 104L225 158V166H115V158Z" fill="#E3A982"/>
