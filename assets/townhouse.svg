<path d="M102 168L170 97L238 168" stroke="#B5654A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<!-- windows pick up the lake blue -->
<circle cx="170" cy="136" r="8" fill="#F8DFAB"/>
<rect x="125" y="176" width="24" height="30" rx="4" fill="#F8DFAB"/>
<rect x="191" y="176" width="24" height="30" rx="4" fill="#F8DFAB"/>
<rect x="125" y="190" width="24" height="3" fill="#F3C9A6"/>
<rect x="191" y="190" width="24" height="3" fill="#F3C9A6"/>
<!-- door -->
<path d="M154 232V206C154 195 161 189 170 189C179 189 186 195 186 206V232H154Z" fill="#343C00"/>
<rect x="150" y="230" width="40" height="5" rx="2.5" fill="#BAD578"/>
<!-- near pines and shrubs overlap the walls, so it sits among the trees -->
<use href="#pine" fill="#53660D" transform="translate(80 150) scale(0.7)"/>
<ellipse cx="141" cy="233" rx="12" ry="8" fill="#53660D"/>
<ellipse cx="203" cy="234" rx="10" ry="7" fill="#718D14"/>
