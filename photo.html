  <script>
    // Runs before the page paints, so the right sky shows immediately.
    // Day/night follows local time; a toggle (sessionStorage) overrides it for this visit.
    window.setSky = function (theme) {
      var root = document.documentElement;
      var now = new Date();
      var h = now.getHours() + now.getMinutes() / 60;
      var phase = h < 5.5 || h >= 19.5 ? 'night' : h < 7.5 ? 'dawn' : h >= 17.5 ? 'dusk' : 'day';
      var natural = phase === 'night' ? 'dark' : 'light';
      theme = theme || natural;
      // How far along its arc the sun (or moon) is: 0 = rising, 0.5 = highest, 1 = setting.
      // It stays centered like the original design; only its height follows the time.
      var p = theme !== natural ? 0.5 : theme === 'dark' ? ((h - 18 + 24) % 24) / 12 : (h - 6) / 12;
      p = Math.min(1, Math.max(0, p));
      var height = Math.sin(Math.PI * p);
      root.dataset.phase = phase;
      root.dataset.theme = theme;
      root.style.setProperty('--sun-top', (2 + (1 - height) * 26).toFixed(1) + '%');
    };
    document.documentElement.classList.add('js');
    var saved = null;
    try { saved = sessionStorage.getItem('theme'); } catch (e) {}
    window.setSky(saved);
  </script>
